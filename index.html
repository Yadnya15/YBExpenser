<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YB Expense Tracker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 25px 15px;
    color: #f8fafc;
    background: linear-gradient(135deg, #070c1f, #172554, #312e81);
}

.container {
    max-width: 950px;
    margin: auto;
}

header {
    margin-bottom: 25px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: #cbd5e1;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    padding: 22px;
    border-radius: 16px;
    background: linear-gradient(135deg, #ffffff, #dbeafe, #ede9fe);
    color: #172554;
    box-shadow: 0 8px 25px #00000025;
}

.card p {
    font-size: 14px;
    margin-bottom: 12px;
    color: #475569;
}

.card h2 {
    font-size: 25px;
    overflow-wrap: anywhere;
}

.income h2 {
    color: #15803d;
}

.expense h2 {
    color: #dc2626;
}

.panel {
    padding: 25px;
    margin-bottom: 22px;
    border-radius: 16px;
    background: linear-gradient(135deg, #ffffff, #eff6ff, #ede9fe);
    color: #172554;
    box-shadow: 0 8px 25px #00000025;
}

.panel h2 {
    font-size: 21px;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: white;
    color: #172554;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px #6366f125;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #1d4ed8, #6366f1);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

.submit-btn {
    width: 100%;
    margin-top: 20px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.history-header h2 {
    margin-bottom: 0;
}

.history-header select {
    width: auto;
    max-width: 150px;
}

.transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid #cbd5e1;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-info {
    min-width: 0;
}

.transaction-info h3 {
    font-size: 15px;
    overflow-wrap: anywhere;
}

.transaction-info p {
    margin-top: 5px;
    font-size: 12px;
    color: #64748b;
    overflow-wrap: anywhere;
}

.transaction-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.amount {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
}

.amount.in {
    color: #15803d;
}

.amount.out {
    color: #dc2626;
}

.delete-btn {
    padding: 8px 10px;
    background: #fee2e2;
    color: #b91c1c;
}

.empty {
    text-align: center;
    padding: 28px 10px;
    color: #64748b;
}

footer {
    text-align: center;
    padding: 12px;
    color: #cbd5e1;
    font-size: 13px;
}

@media (max-width: 650px) {
    .summary {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .card {
        padding: 18px;
    }

    .card h2 {
        font-size: 23px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 20px 16px;
    }

    .transaction {
        align-items: flex-start;
    }

    .transaction-right {
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
    }

    .history-header {
        align-items: flex-start;
    }
}
</style>
</head>

<body>
<div class="container">

    <header>
        <h1>💰 YB Expense Tracker</h1>
        <p>Manage your money. Track your future.</p>
    </header>

    <!-- Dashboard -->
    <section class="summary">
        <div class="card">
            <p>Total Balance</p>
            <h2 id="balance">₹0.00</h2>
        </div>

        <div class="card income">
            <p>Total Income</p>
            <h2 id="income">₹0.00</h2>
        </div>

        <div class="card expense">
            <p>Total Expenses</p>
            <h2 id="expenses">₹0.00</h2>
        </div>
    </section>

    <!-- Add Transaction -->
    <section class="panel">
        <h2>➕ Add Transaction</h2>

        <form id="transactionForm">
            <div class="form-grid">

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount"
                           placeholder="Enter amount"
                           min="0.01" max="1000000000000"
                           step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Salary">Salary</option>
                        <option value="Business">Business</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="description">Description</label>
                    <input type="text" id="description"
                           placeholder="e.g. Monthly salary or lunch"
                           maxlength="100" required>
                </div>

            </div>

            <button type="submit" class="submit-btn">
                + Add Transaction
            </button>
        </form>
    </section>

    <!-- Transaction History -->
    <section class="panel">
        <div class="history-header">
            <h2>📋 Transaction History</h2>

            <select id="filter" aria-label="Filter transactions">
                <option value="all">All</option>
                <option value="income">Income</option>
                <option value="expense">Expenses</option>
            </select>
        </div>

        <div id="transactionList" aria-live="polite"></div>
    </section>

    <footer>
        YB Expense Tracker | Your money, your control.
    </footer>

</div>

<script>
// Get HTML elements
const form = document.getElementById("transactionForm");
const typeInput = document.getElementById("type");
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const dateInput = document.getElementById("date");
const descriptionInput = document.getElementById("description");
const filterInput = document.getElementById("filter");
const list = document.getElementById("transactionList");

// Load saved transactions
let transactions = [];

try {
    const saved = localStorage.getItem("ybTransactions");
    const parsed = saved ? JSON.parse(saved) : [];

    if (Array.isArray(parsed)) {
        transactions = parsed.filter(t =>
            t &&
            typeof t.id === "string" &&
            ["income", "expense"].includes(t.type) &&
            Number.isFinite(t.amount) &&
            t.amount > 0 &&
            t.amount <= 1000000000000 &&
            typeof t.category === "string" &&
            typeof t.description === "string" &&
            typeof t.date === "string" &&
            !isNaN(Date.parse(t.date))
        );
    }
} catch (error) {
    transactions = [];
}

// Set today's date
dateInput.value = new Date().toLocaleDateString("en-CA");

function money(amount) {
    return amount.toLocaleString("en-IN", {
        style: "currency",
        currency: "INR"
    });
}

// Save data in browser storage
function saveTransactions() {
    try {
        localStorage.setItem(
            "ybTransactions",
            JSON.stringify(transactions)
        );
        return true;
    } catch (error) {
        alert("Unable to save data. Check your browser storage.");
        return false;
    }
}

// Update dashboard
function updateDashboard() {
    const income = transactions
        .filter(t => t.type === "income")
        .reduce((sum, t) => sum + t.amount, 0);

    const expenses = transactions
        .filter(t => t.type === "expense")
        .reduce((sum, t) => sum + t.amount, 0);

    document.getElementById("balance").textContent =
        money(income - expenses);

    document.getElementById("income").textContent =
        money(income);

    document.getElementById("expenses").textContent =
        money(expenses);
}

// Display transaction history
function renderTransactions() {
    updateDashboard();
    list.replaceChildren();

    const selectedFilter = filterInput.value;

    const filtered = transactions
        .filter(t =>
            selectedFilter === "all" ||
            t.type === selectedFilter
        )
        .slice()
        .reverse();

    if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No transactions found. Add one above!";
        list.appendChild(empty);
        return;
    }

    filtered.forEach(t => {
        const row = document.createElement("div");
        row.className = "transaction";

        const info = document.createElement("div");
        info.className = "transaction-info";

        const title = document.createElement("h3");
        title.textContent = t.description;

        const details = document.createElement("p");
        details.textContent =
            t.category + " • " + t.date + " • " +
            (t.type === "income" ? "Income" : "Expense");

        info.append(title, details);

        const right = document.createElement("div");
        right.className = "transaction-right";

        const amount = document.createElement("span");
        amount.className =
            "amount " + (t.type === "income" ? "in" : "out");

        amount.textContent =
            (t.type === "income" ? "+ " : "- ") + money(t.amount);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.type = "button";
        deleteButton.setAttribute(
            "aria-label", "Delete " + t.description
        );

        deleteButton.addEventListener("click", () => {
            if (!confirm("Delete this transaction?")) return;

            const previous = transactions;
            transactions = transactions.filter(item => item.id !== t.id);

            if (!saveTransactions()) {
                transactions = previous;
                return;
            }

            renderTransactions();
        });

        right.append(amount, deleteButton);
        row.append(info, right);
        list.appendChild(row);
    });
}

// Add a new transaction
form.addEventListener("submit", function(event) {
    event.preventDefault();

    const amount = Number(amountInput.value);
    const description = descriptionInput.value.trim();
    const date = dateInput.value;

    if (
        !Number.isFinite(amount) ||
        amount <= 0 ||
        amount > 1000000000000 ||
        !description ||
        !date ||
        isNaN(Date.parse(date))
    ) {
        alert("Please enter valid transaction details.");
        return;
    }

    const transaction = {
        id: Date.now().toString() + "-" +
            Math.random().toString(36).slice(2),
        type: typeInput.value,
        amount: Math.round(amount * 100) / 100,
        category: categoryInput.value,
        date: date,
        description: description
    };

    transactions.push(transaction);

    if (!saveTransactions()) {
        transactions.pop();
        return;
    }

    form.reset();
    dateInput.value = new Date().toLocaleDateString("en-CA");
    typeInput.value = "income";
    categoryInput.value = "Salary";
    filterInput.value = "all";

    renderTransactions();
});

// Filter history
filterInput.addEventListener("change", renderTransactions);

// Initial display
renderTransactions();
</script>
</body>
</html>
